name = "agent-swarm-orchestrator"
main = "src/index.ts"
compatibility_date = "2024-09-01"
account_id = "6f6959ecba86d1de4d6cf6aa0b34528d"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "WORKFLOW_DO"
class_name = "WorkflowDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorkflowDO"]

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "agent-swarm-artifacts"

[[r2_buckets]]
binding = "SKILLS"
bucket_name = "handoff-skills"

[assets]
directory = "./frontend/dist/"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true
