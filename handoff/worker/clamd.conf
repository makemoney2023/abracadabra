# ClamAV limits for Handoff (HND-032). Limit alerts stay held, not clean.
LogTime yes
LogSyslog no
PidFile /tmp/clamd.pid
TemporaryDirectory /tmp
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 127.0.0.1
StreamMaxLength 2G
MaxFileSize 2G
MaxScanSize 2G
MaxRecursion 16
MaxFiles 10000
ScanArchive yes
AlertExceedsMax yes
Foreground no
User root
