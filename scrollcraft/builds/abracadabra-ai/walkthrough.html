<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;1,400&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Theme tokens. Unlayered, so they win over the engine's @layer sw defaults. */
  :root, .sw-root {
    --sw-bg: #0B0A08;
    --sw-ink: #F3EEE4;
    --sw-ink-soft: #A89F93;
    --sw-accent: #E23B2F;
    --sw-font-display: "Outfit", system-ui, sans-serif;
    --sw-font-body: "IBM Plex Sans", system-ui, sans-serif;
  }
  html, body { margin: 0; background: var(--sw-bg); color: var(--sw-ink); }

  /* The footage is product UI, not a diorama. Frame it as a screen on the right
     of a dark stage so the copy on the left never sits over the product's own text. */
  .sw-scene__video, .sw-scene__still {
    left: auto; right: 3vw; top: 50%; width: 56vw; height: min(80vh, 56vw * 0.625);
    transform: translateY(-50%);
    object-fit: contain; object-position: center;
    border-radius: 10px;
    box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(243,238,228,.08);
    background: #000;
  }
  .sw-scene__still { transform: translateY(-50%) !important; }
  .sw-copylayer::before { display: none; }
  .sw-copy { width: min(34vw, 420px); }

  /* Scrollcraft house rules: no counters, no scroll cue. */
  .sw-copy__num, .sw-hint { display: none; }

  /* Dark overrides for engine chrome that assumes a light page. */
  .sw-sky__glow { background: radial-gradient(60% 42% at 74% 16%, color-mix(in srgb, var(--sw-accent) 10%, transparent), transparent 70%); }
  .sw-pt { display: none; }
  .sw-nav { background: color-mix(in srgb, #fff 6%, transparent); border-color: rgba(243,238,228,.12); }
  .sw-nav__item.is-active { color: var(--sw-bg); }
  .sw-topcta, .sw-btn--primary { color: var(--sw-bg); background: var(--sw-ink); }
  .sw-btn--ghost { color: var(--sw-ink); border-color: rgba(243,238,228,.3); }
  .sw-copy__tags li { color: var(--sw-ink); background: color-mix(in srgb, var(--sw-accent) 18%, var(--sw-bg)); border-color: color-mix(in srgb, var(--sw-accent) 40%, transparent); }
  .sw-route__label { color: var(--sw-ink); background: color-mix(in srgb, #fff 10%, var(--sw-bg)); }
  .sw-copy__title { font-size: clamp(1.8rem, 3.1vw, 2.7rem); }
  .sw-copy__eyebrow { font-family: ui-monospace, Menlo, monospace; font-weight: 500; }
  .sw-copy__body { color: var(--sw-ink-soft); }

  @media (max-width: 860px) {
    .sw-scene__video, .sw-scene__still {
      left: 4vw; right: 4vw; top: calc(60px + env(safe-area-inset-top)); width: 92vw; height: 57.5vw;
      transform: none; border-radius: 8px;
    }
    .sw-scene__still { transform: none !important; }
    .sw-copy { width: auto; }
  }
</style>
</head>
